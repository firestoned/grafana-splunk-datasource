# Dashboards provider for local dev. Loads any dashboard JSON from
# /var/lib/grafana/dashboards on Grafana startup. Docker Compose mounts
# ./src/dashboards there so edits show up after the dashboard provider
# rescans (default 10s — see updateIntervalSeconds).

apiVersion: 1

providers:
  - name: Splunk examples
    orgId: 1
    folder: Splunk
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
